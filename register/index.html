<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#2a2023"><meta name="description" content="Create a Herald Voyages account to keep your private travel history synced across devices."><title>Create account — Herald Voyages</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../accounts.css"><link rel="stylesheet" href="../voyages.css?v=flags-4">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script defer src="../account-config.js"></script><script defer src="../account-client.js"></script><script defer src="../theme.js?v=flags-4"></script><script defer src="../account-pages.js"></script><script defer src="../voyages.js?v=flags-4"></script><link rel="icon" type="image/png" href="../assets/herald-favicon.png?v=4"></head>
<body data-account-page="register"><main class="account-page"><div class="brand"><div class="brand-mark"></div><div><strong>Herald Voyages</strong><span>Where you’ve been. Where you’re going.</span></div></div>
<header class="topbar"><h1>Create account</h1><a id="backToTracker" class="secondary" href="../">Back to dashboard</a></header>
<p id="accountMessage" class="form-message" role="status" aria-live="polite"></p>
<section class="panel account-card"><p class="panel-copy">Keep your travel history private and synced. If you already recorded trips as a guest, you can transfer them into your account after signing in.</p><form id="registerForm"><label class="field" for="displayName"><span>Your name</span><input id="displayName" type="text" autocomplete="name" required maxlength="80"></label><label class="field" for="email"><span>Email</span><input id="email" type="email" autocomplete="username" required maxlength="254"></label><label class="field" for="newPassword"><span>New password</span><input id="newPassword" type="password" autocomplete="new-password" required minlength="8"></label><label class="field" for="confirmPassword"><span>Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8"></label><button class="primary wide">Create account</button></form><div class="account-links"><a href="../login/">Already have an account? Log in</a></div></section></main></body></html>
