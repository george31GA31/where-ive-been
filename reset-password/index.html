<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><title>Reset password — Where I've Been</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../accounts.css">
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script defer src="../account-config.js"></script><script defer src="../account-client.js"></script><script defer src="../theme.js"></script><script defer src="../account-pages.js"></script></head>
<body data-account-page="reset-password"><main class="account-page"><div class="brand"><div class="brand-mark"></div><div><strong>Where I've Been</strong><span>Travel day tracker</span></div></div>
<header class="topbar"><h1>Reset password</h1><a id="backToTracker" class="secondary" href="../">Back to tracker</a></header>
<p id="accountMessage" class="form-message" role="status" aria-live="polite"></p>
<section class="panel account-card"><form id="resetForm"><p class="panel-copy">Enter your email and we’ll send a password reset link.</p><label class="field" for="email"><span>Email</span><input id="email" type="email" autocomplete="username" required maxlength="254"></label><button class="primary wide">Send reset link</button></form><form id="recoveryForm" hidden><label class="field" for="newPassword"><span>New password</span><input id="newPassword" type="password" autocomplete="new-password" required minlength="8"></label><label class="field" for="confirmPassword"><span>Confirm new password</span><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8"></label><button class="primary wide">Save new password</button></form><div class="account-links"><a href="../login/">Back to login</a></div></section></main></body></html>
