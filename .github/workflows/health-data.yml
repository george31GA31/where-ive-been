name: Refresh destination health guidance

on:
  schedule:
    - cron: "17 5 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: health-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Install validation dependencies
        run: npm ci --ignore-scripts
      - name: Refresh public country facts
        run: node scripts/update-health-data.cjs
      - name: Refresh committed browser outputs and offline shell
        run: npm run build
      - name: Validate source parsing, mappings and entry behaviour
        run: npm test
      - name: Check DOM integration
        run: npm run test:dom
      - name: Check browser regressions
        run: npm run test:browser
      - name: Commit validated provider snapshot
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add data/entry-requirements/travelhealthpro.js data/entry-requirements/health-refresh.json sw.js
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh TravelHealthPro destination guidance"
          # A concurrent code update requires a new validated run, not an automatic merge.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish refreshed guidance using the existing Pages source
        if: steps.snapshot.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
