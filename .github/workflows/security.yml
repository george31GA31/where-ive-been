name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check DOM integration
        run: npm run test:dom
      - name: Check browser layouts and keyboard interactions
        run: npm run test:browser
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/
      - name: Check country imports
        run: python tests/test_country_import.py
      - name: Check account sync and migration
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js app-core.js app-fixes.js theme.js security-runtime.js map-enhancements.js country-count-model.js dashboard-enhancements.js account-config.js account-client.js account-model.js account-sync.js account-tracker.js account-pages.js herald.js voyages.js atlas-model.js journey-model.js journeys.js calendar-experience.js place-search.js flight-editor.js journey-routes.js journey-map.js journey-library.js journey-global-model.js saved-places-model.js saved-places.js home-choice.js accommodation-times.js calendar-layout-model.js visa-notices.js travel-search.js travel-costs.js transport-details.js transport-icons.js entry-rules.js entry-checker.js entry-health.js address-display.js accommodation-place-model.js data/entry-requirements/guidance.js data/entry-requirements/passport-index.js vendor/anyascii/anyascii.js scripts/update-entry-data.cjs scripts/update-health-data.cjs scripts/travelhealthpro-parser.cjs scripts/build-water-land.cjs data/entry-requirements/travelhealthpro.js calendar-details.js trip-experience.js travel-navigation.js journey-presentation.js accommodation-logos.js; do
            node --check "$file"
          done

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:javascript-typescript"

      - name: Summarise CodeQL diagnostic findings
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['CODEQL_ACTION_SARIF_RESULTS_OUTPUT_DIR']) / 'javascript.sarif').read_text())
          for run in report['runs']:
              for result in run.get('results', []):
                  print(json.dumps({'rule': result['ruleId'], 'message': result['message'], 'locations': result.get('locations'), 'flows': result.get('codeFlows')}, ensure_ascii=True))
          PY
