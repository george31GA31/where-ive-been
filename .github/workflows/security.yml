name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install test dependencies
        run: npm ci --ignore-scripts
      - name: Check DOM integration
        run: npm run test:dom
      - name: Check browser layouts and keyboard interactions
        run: npm run test:browser
      - name: Retain browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/browser
      - name: Check country imports
        run: python tests/test_country_import.py
      - name: Check account sync and migration
        run: node --test tests/*.test.cjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in app.js app-core.js app-fixes.js theme.js security-runtime.js map-enhancements.js country-count-model.js dashboard-enhancements.js account-config.js account-client.js account-model.js account-sync.js account-tracker.js account-pages.js herald.js voyages.js atlas-model.js journey-model.js journeys.js; do
            node --check "$file"
          done

  codeql:
    name: CodeQL (JavaScript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:javascript-typescript"
