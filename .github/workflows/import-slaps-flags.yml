name: Import SlapsGame flags

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/import-slaps-flags.yml
      - scripts/import-slaps-flags.py

permissions:
  contents: write

jobs:
  import-flags:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Where I've Been
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy SlapsGame flag artwork
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/george31GA31/SlapsGame.git /tmp/SlapsGame
          rm -rf assets/flags
          mkdir -p assets/flags
          cp -a /tmp/SlapsGame/assets/flags/. assets/flags/
          cp /tmp/SlapsGame/countries.js assets/slaps-countries.js

      - name: Update flag rendering
        run: python3 scripts/import-slaps-flags.py

      - name: Validate JavaScript and copied assets
        run: |
          set -euo pipefail
          test -f "assets/flags/United Kingdom.png"
          test -f "assets/flags/Switzerland.png"
          test -f "assets/flags/Nepal.png"
          node --check app-core.js
          node --check app.js
          node --check assets/slaps-countries.js
          echo "Copied $(find assets/flags -maxdepth 1 -type f | wc -l) SlapsGame flag files"

      - name: Commit imported flags
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/flags assets/slaps-countries.js assets/flag-manifest.js app-core.js app.js styles.css index.html
          if git diff --cached --quiet; then
            echo "No flag changes to commit"
            exit 0
          fi
          git commit -m "Use SlapsGame flags at natural proportions"
          git pull --rebase origin main
          git push origin HEAD:main
